name: Docker smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [compose.yaml, Dockerfile, .dockerignore, "app/**", pyproject.toml, uv.lock, .github/workflows/docker.yml]

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_PASSWORD: ephemeral-ci-password
    steps:
      - uses: actions/checkout@v6
      - name: Build and start the stack
        run: docker compose up --build --wait
      - name: Query PostgreSQL over TCP
        run: |
          PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U bookmarks -d bookmarks -c 'SELECT 1'
      - name: Check the bookmarks endpoint
        run: |
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 \
            --output bookmarks.json http://127.0.0.1:8000/bookmarks
          jq -e '. == []' bookmarks.json
      - name: Show server logs
        if: always()
        run: docker compose logs
