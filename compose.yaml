services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bookmarks
      POSTGRES_USER: bookmarks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "bookmarks", "-d", "bookmarks"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
